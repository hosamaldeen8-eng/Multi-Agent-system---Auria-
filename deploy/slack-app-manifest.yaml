# Auria Fleet — Slack app manifest.
# Paste this at https://api.slack.com/apps  ->  "Create New App"  ->  "From a manifest".
# It configures every scope, event, and Socket Mode in one shot. After creating:
#   1. Install to Workspace (OAuth & Permissions) -> copy the Bot User OAuth Token (xoxb-...)
#   2. Basic Information -> App-Level Tokens -> Generate a token with scope
#      `connections:write` -> copy it (xapp-...)
# Put both in the server's .env as SLACK_BOT_TOKEN and SLACK_APP_TOKEN.

display_information:
  name: Auria Fleet
  description: Auria's AI operations fleet — monitoring and commands.
  background_color: "#1f2d3d"

features:
  bot_user:
    display_name: auria-fleet
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read     # receive @mentions
      - chat:write            # post replies and alerts
      - chat:write.public     # post to channels the bot isn't a member of
      - channels:history      # read messages in public channels it's in
      - groups:history        # read messages in private channels it's in
      - im:history            # read DMs
      - im:read               # receive DM events
      - users:read            # resolve who sent a message

settings:
  event_subscriptions:
    bot_events:
      - app_mention           # someone @mentions the bot in a channel
      - message.im            # someone DMs the bot
  socket_mode_enabled: true   # no public URL needed
  org_deploy_enabled: false
  token_rotation_enabled: false
